name: desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Type-check and build frontend
        run: npm run build
      - name: Rust tests (core + CLI/MCP contract against the OS credential store)
        run: cargo test --workspace
      - name: Bundle
        run: npx tauri build --bundles ${{ matrix.os == 'windows-latest' && 'nsis' || 'app' }}

      - uses: actions/upload-artifact@v4
        with:
          name: keyfold-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/macos/*.app
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Version check (src-tauri/Cargo.toml and package.json)
        run: sh scripts/check-version.sh
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
