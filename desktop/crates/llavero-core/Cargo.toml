[package]
name = "llavero-core"
version = "0.1.0"
edition = "2021"
description = "Key vault core: names and projects in a registry, values only in the OS credential store."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same item format as the Swift version: generic password, service + account.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# Windows Credential Manager (official Microsoft bindings).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
